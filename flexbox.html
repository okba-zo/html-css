<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>flexbox practice</title>
  </head>
  <body>
    <div style=" border: 1px solid black; display: flex; justify-content: space-between; flex-direction: row">
      <div style=" width: 100px; background-color: lightseagreen">div 1 text </div>
      <div style=" width: 100px; background-color: lightcoral">div 2 text </div>
      <div style=" width: 100px; background-color: lightblue">div 3 text </div>
    </div>
    <div style=" border: 1px solid black; display: flex; align-items: center; justify-content: space-between; flex-direction: row">
      <div style=" width: 100px; background-color: lightseagreen">div 1 text </div>
      <div style=" width: 100px; background-color: lightcoral">div 2 text </div>
      <div style=" width: 100px; background-color: lightblue">div 3 text </div>
    </div>
  </body>
</html>
